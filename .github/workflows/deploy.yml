name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build (static, base=/fatca-tin-navigator/)
        env:
          NITRO_PRESET: static
          VITE_BASE: /fatca-tin-navigator/
        run: bun run build

      - name: Locate build output
        id: out
        run: |
          set -eu

          for dir in .output/public dist/client dist build/client build .vercel/output/static; do
            if [ -f "$dir/index.html" ]; then
              ASSETS=$(find "$dir" -type f \( -name "*.js" -o -name "*.css" \) | wc -l | tr -d ' ')
              if [ "$ASSETS" -ge 1 ]; then
                echo "dir=$dir" >> "$GITHUB_OUTPUT"
                echo "Using build output: $dir"
                exit 0
              fi
            fi
          done

          FOUND_DIR=""
          for root in .output dist build .vercel/output; do
            [ -d "$root" ] || continue

            while IFS= read -r index_file; do
              dir=$(dirname "$index_file")
              ASSETS=$(find "$dir" -type f \( -name "*.js" -o -name "*.css" \) | wc -l | tr -d ' ')
              if [ "$ASSETS" -ge 1 ]; then
                FOUND_DIR="$dir"
                break 2
              fi
            done < <(find "$root" -type f -name "index.html")
          done

          if [ -n "$FOUND_DIR" ]; then
            echo "dir=$FOUND_DIR" >> "$GITHUB_OUTPUT"
            echo "Using discovered build output: $FOUND_DIR"
            exit 0
          fi

          echo "::error::No build output found"
          ls -la
          for root in .output dist build .vercel/output; do
            [ -d "$root" ] && echo "--- $root ---" && find "$root" -maxdepth 3 -type f | sort || true
          done
          exit 1

      - name: Verify build output
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          echo "Checking build output in $DIR"
          if [ ! -f "$DIR/index.html" ]; then
            echo "::error::Missing index.html in $DIR"
            ls -la "$DIR"
            exit 1
          fi
          ASSETS=$(find "$DIR" -type f \( -name "*.js" -o -name "*.css" \) | wc -l)
          if [ "$ASSETS" -lt 1 ]; then
            echo "::error::No JS/CSS assets found in $DIR"
            exit 1
          fi
          SIZE=$(du -sh "$DIR" | cut -f1)
          echo "Build OK — index.html present, $ASSETS asset files, total size: $SIZE"

      - name: SPA fallback (404.html = index.html)
        run: cp ${{ steps.out.outputs.dir }}/index.html ${{ steps.out.outputs.dir }}/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
