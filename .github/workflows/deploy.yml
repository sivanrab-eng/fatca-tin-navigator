name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build (static, base=/TIN-FINDER/)
        env:
          NITRO_PRESET: static
          VITE_BASE: /TIN-FINDER/
        run: bun run build

      - name: Locate build output
        id: out
        run: |
          if [ -f ".output/public/index.html" ]; then echo "dir=.output/public" >> $GITHUB_OUTPUT;
          elif [ -f "dist/client/index.html" ]; then echo "dir=dist/client" >> $GITHUB_OUTPUT;
          elif [ -f "dist/index.html" ]; then echo "dir=dist" >> $GITHUB_OUTPUT;
          else echo "::error::No build output found"; ls -la; exit 1; fi

      - name: Verify build output
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          echo "Checking build output in $DIR"
          if [ ! -f "$DIR/index.html" ]; then
            echo "::error::Missing index.html in $DIR"
            ls -la "$DIR"
            exit 1
          fi
          ASSETS=$(find "$DIR" -type f \( -name "*.js" -o -name "*.css" \) | wc -l)
          if [ "$ASSETS" -lt 1 ]; then
            echo "::error::No JS/CSS assets found in $DIR"
            exit 1
          fi
          SIZE=$(du -sh "$DIR" | cut -f1)
          echo "Build OK — index.html present, $ASSETS asset files, total size: $SIZE"

      - name: SPA fallback (404.html = index.html)
        run: cp ${{ steps.out.outputs.dir }}/index.html ${{ steps.out.outputs.dir }}/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
