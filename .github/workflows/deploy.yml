name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build (static, base=/fatca-tin-navigator/)
        env:
          NITRO_PRESET: static
          VITE_BASE: /fatca-tin-navigator/
        # Nitro's SSR sub-build fails for a pure SPA, but dist/client is fully
        # generated before that step. Tolerate the non-zero exit and let the
        # next step assert that dist/client/index.html exists.
        run: bun run build || echo "Build exited non-zero; verifying dist/client next."

      - name: Verify build output
        run: |
          set -eu

          DIR="dist/client"
          echo "Checking build output in $DIR"
          if [ ! -f "$DIR/index.html" ]; then
            echo "::error::Missing index.html in $DIR"
            ls -la
            for root in dist .output build .vercel/output; do
              [ -d "$root" ] && echo "--- $root ---" && find "$root" -maxdepth 4 -type f | sort || true
            done
            exit 1
          fi
          ASSETS=$(find "$DIR" -type f \( -name "*.js" -o -name "*.css" \) | wc -l)
          if [ "$ASSETS" -lt 1 ]; then
            echo "::error::No JS/CSS assets found in $DIR"
            exit 1
          fi
          SIZE=$(du -sh "$DIR" | cut -f1)
          echo "Build OK — index.html present, $ASSETS asset files, total size: $SIZE"

      - name: SPA fallback (404.html = index.html)
        run: cp dist/client/index.html dist/client/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
