[build]
  # Build the site, then ensure an index.html exists for SPA fallback
  command = "bun run build && node scripts/ensure-index-html.mjs"
  publish = "dist/client"

[build.environment]
  NITRO_PRESET = "static"
  VITE_BASE = "/"
  NODE_VERSION = "20"

# SPA fallback — unknown routes serve index.html so the client router can handle them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
