[build]
  command = "bun run build || echo 'Nitro SSR step may exit non-zero; dist/client is what we publish.'"
  publish = "dist/client"

[build.environment]
  NITRO_PRESET = "static"
  VITE_BASE = "/"
  NODE_VERSION = "20"

# SPA fallback — every unknown route serves index.html so the client router can handle it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
