[build]
  command = "bun scripts/build-static-netlify.mjs"
  publish = "dist/netlify-static"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — unknown routes serve index.html so the client router can handle them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
